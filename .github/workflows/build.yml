name: Cloud Build
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Third-Party Libraries
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          # I updated the key here to "qt6" so it ignores the broken files from the last run
          key: ${{ runner.os }}-tdesktop-qt6-libs-${{ hashFiles('Telegram/build/prepare/**') }}

      - name: Run Telegram Prepare
        run: |
          # Added the 'qt6' flag here
          .\Telegram\build\prepare\win.bat qt6

      - name: Configure and Build
        env:
          MY_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          MY_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          # Added the DESKTOP_APP_QT6=ON flag here along with your API keys
          .\Telegram\configure.bat x64 -D TDESKTOP_API_ID=$env:MY_API_ID -D TDESKTOP_API_HASH=$env:MY_API_HASH -D DESKTOP_APP_QT6=ON
          cmake --build out --config Release --target Telegram

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: OjjotMod-Binary
          path: out/Release/Telegram.exe